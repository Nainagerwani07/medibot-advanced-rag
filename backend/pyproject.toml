[project]
name = "medibot"
version = "0.1.0"
description = "Secure healthcare assistant: Hybrid RAG, reranking, SQL RAG and Qdrant-level RBAC"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "docling>=2.130.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "groq>=1.7.0",
    "pyjwt>=2.15.1",
    "qdrant-client>=1.19.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, S bandit (security)
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]
# attack prompts are data; keeping each on one line keeps them readable and greppable
"scripts/attack_demo.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only machine (NF2): take torch/torchvision from PyTorch's CPU wheel index instead of the
# default CUDA build (~4 GB of unused GPU libraries).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
