# Git hooks run on every commit (by a human or Claude). Install once: `pre-commit install`
# Run on all files manually: `pre-commit run --all-files`
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # block API keys / tokens (e.g. Groq gsk_...) from being committed

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch # all work happens on feature branches
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8 # keep in sync with ruff in backend/pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
